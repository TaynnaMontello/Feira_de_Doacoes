{% extends "base.html" %}
{% block content %}

<h2>Solicitar Troca</h2>

<p>Você está solicitando troca pelo item:</p>

<h3>{{ item.nome }}</h3>
<p>{{ item.descricao }}</p>
<p><strong>Dono:</strong> {{ item.dono.nome }}</p>

<a href="{{ url_for('item.solicitar_troca', item_id=item.id) }}" 
   class="btn btn-primary">
    Solicitar Troca
</a>

{% endblock %}
